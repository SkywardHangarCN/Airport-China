<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机场信息查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .commercial-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }

        .table-row {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
        }

        .table-row:hover {
            background-color: #f1f5f9;
            border-left: 3px solid #3b82f6;
            transform: translateX(2px);
        }

        /* 文字截斷樣式 */
        .truncate-cell {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card-premium {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <!-- 头部 -->
    <header class="commercial-gradient text-white py-12 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        <div class="container mx-auto px-4 relative z-10">
            <div class="flex flex-col items-center">
                <div class="mb-4 bg-blue-500/20 p-3 rounded-2xl backdrop-blur-md border border-white/10">
                    <svg class="w-10 h-10 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.25c-.16.09-.33.12-.5.12s-.34-.03-.5-.12l-7.97-4.25c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.97-4.25c.16-.09.33-.12.5-.12s.34.03.5.12l7.97 4.25c.32.17.53.5.53.88v9z"/>
                    </svg>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-center mb-3 bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400">
                    中國机场信息查询系统
                </h1>
                <div class="h-1 w-24 bg-blue-500 rounded-full mb-4"></div>
                <p class="text-center text-slate-400 font-medium tracking-widest uppercase text-sm">
                    China-Premium Aviation Database
                </p>
            </div>
        </div>
    </header>

    <!-- 搜索栏 -->
    <div class="container mx-auto px-4 -mt-8 relative z-20">
        <div class="max-w-3xl mx-auto">
            <div class="relative group">
                <div class="absolute inset-0 bg-blue-500/20 rounded-2xl blur-xl group-hover:bg-blue-500/30 transition-all duration-500"></div>
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜尋機場名稱、代碼、城市或國家..." 
                        class="w-full px-7 py-5 pl-14 rounded-2xl border-0 focus:ring-2 focus:ring-blue-500 bg-white text-slate-800 shadow-2xl text-lg placeholder-slate-400"
                    >
                    <div class="absolute left-5 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <div class="absolute right-4 flex gap-2">
                        <span class="px-3 py-1 bg-slate-100 rounded-lg text-xs font-bold text-slate-400 border border-slate-200">⌘ K</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 机场列表 -->
    <div class="container mx-auto px-4 py-12 max-w-6xl">
        <div class="flex justify-between items-end mb-6 px-2">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">航站數據庫</h2>
                <p class="text-slate-500 text-sm mt-1">實時更新的全球民航與軍事設施資訊</p>
            </div>
            <p id="resultCount" class="text-sm font-bold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg border border-blue-100"></p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden card-premium">
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full table-fixed border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 backdrop-blur-sm border-b border-slate-200">
                            <th class="w-1/4 px-8 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">中文名稱</th>
                            <th class="w-1/4 px-8 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">英文名稱</th>
                            <th class="w-1/6 px-8 py-5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">ICAO</th>
                            <th class="w-1/6 px-8 py-5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">IATA</th>
                            <th class="w-1/6 px-8 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">城市</th>
                        </tr>
                    </thead>
                    <tbody id="airportTable" class="divide-y divide-slate-100">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-slate-900 text-slate-400 py-16 mt-20 border-t border-slate-800">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-10 max-w-6xl mx-auto">
                <div class="text-center md:text-left space-y-4 max-w-md">
                    <div class="flex items-center gap-3 justify-center md:justify-start">
                        <div class="bg-blue-600 p-2 rounded-lg">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.25c-.16.09-.33.12-.5.12s-.34-.03-.5-.12l-7.97-4.25c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.97-4.25c.16-.09.33-.12.5-.12s.34.03.5.12l7.97 4.25c.32.17.53.5.53.88v9z"/>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-white tracking-tight">云端机库CN</span>
                    </div>
                    <p class="text-xs leading-relaxed opacity-60 font-medium">
                        本頁面數據僅供模擬飛行、航空愛好者使用，非官方資料。嚴禁用於任何違法違規及危害國家安全的行為。數據內容不具備導航效力。
                    </p>
                </div>
                
                <div class="flex flex-col items-center md:items-end gap-4">
                    <div class="flex gap-6 text-sm font-bold uppercase tracking-widest">
                        <a href="#" class="hover:text-blue-500 transition-colors">Database</a>
                        <a href="#" class="hover:text-blue-500 transition-colors">API</a>
                        <a href="#" class="hover:text-blue-500 transition-colors">Support</a>
                    </div>
                    <div class="pt-4 text-center md:text-right">
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">
                            Copyright © 2026 云端机库CN. All Rights Reserved.
                        </p>
                        <p class="text-[10px] text-slate-600 mt-1">
                            版權所有© 2026 云端机库CN.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div id="modalContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script src="airports-data.js"></script>
    <script>
        // 渲染机场表格
        function renderTable(data) {
            const tbody = document.getElementById('airportTable');
            const countEl = document.getElementById('resultCount');
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                            <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-lg">未找到匹配的机场</p>
                        </td>
                    </tr>
                `;
                countEl.textContent = '';
                return;
            }

            tbody.innerHTML = data.map(airport => `
                <tr class="table-row cursor-pointer transition-all" onclick="showDetail('${airport.icao}')">
                    <td class="px-8 py-5 truncate-cell" title="${airport.nameZh}">
                        <div class="font-bold text-slate-700">${airport.nameZh}</div>
                    </td>
                    <td class="px-8 py-5 text-slate-500 text-sm truncate-cell font-medium" title="${airport.nameEn}">${airport.nameEn}</td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-block bg-slate-100 text-slate-700 px-3 py-1 rounded-md font-mono text-xs font-bold border border-slate-200">${airport.icao}</span>
                    </td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-md font-mono text-xs font-bold border border-blue-100">${airport.iata}</span>
                    </td>
                    <td class="px-8 py-5 text-slate-600 truncate-cell font-medium" title="${airport.city}">
                        <div class="flex items-center gap-2">
                            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            </svg>
                            ${airport.city}
                        </div>
                    </td>
                </tr>
            `).join('');

            countEl.textContent = `共 ${data.length} 个机场`;
        }

        // 搜索功能
        function searchAirports(keyword) {
            if (!keyword.trim()) {
                return airports;
            }
            
            const kw = keyword.toLowerCase().trim();
            return airports.filter(airport => 
                airport.nameZh.toLowerCase().includes(kw) ||
                airport.nameEn.toLowerCase().includes(kw) ||
                airport.icao.toLowerCase().includes(kw) ||
                airport.iata.toLowerCase().includes(kw) ||
                airport.city.toLowerCase().includes(kw) ||
                airport.cityEn.toLowerCase().includes(kw) ||
                airport.country.toLowerCase().includes(kw) ||
                airport.countryEn.toLowerCase().includes(kw)
            );
        }

        // 显示详情
        function showDetail(icao) {
            const airport = airports.find(a => a.icao === icao);
            if (!airport) return;

            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="commercial-gradient text-white p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-6">
                            <div class="bg-blue-500/20 px-3 py-1 rounded-md border border-white/10 text-[10px] font-bold uppercase tracking-widest text-blue-300 mb-2 inline-block">
                                Terminal Detail
                            </div>
                            <button onclick="closeModal()" class="text-white/50 hover:text-white transition-colors bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <h2 class="text-3xl font-extrabold tracking-tight mb-2">${airport.nameZh}</h2>
                        <p class="text-slate-400 font-medium text-sm mb-6 uppercase tracking-wider">${airport.nameEn}</p>
                        
                        <div class="flex gap-4">
                            <div class="bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">ICAO Code</span>
                                <span class="font-mono text-lg font-bold text-blue-400">${airport.icao}</span>
                            </div>
                            <div class="bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">IATA Code</span>
                                <span class="font-mono text-lg font-bold text-blue-400">${airport.iata}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="p-8 space-y-8 bg-white">
                    <div class="grid grid-cols-2 gap-8">
                        <!-- 基本信息 -->
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                                Geographic Location
                            </h3>
                            <div class="grid grid-cols-1 gap-3">
                                <div class="group">
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">City / 城市</span>
                                    <p class="text-slate-700 font-bold group-hover:text-blue-600 transition-colors">${airport.city} <span class="text-slate-400 font-medium text-xs ml-1">/ ${airport.cityEn}</span></p>
                                </div>
                                <div class="group">
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">Country / 國家</span>
                                    <p class="text-slate-700 font-bold group-hover:text-blue-600 transition-colors">${airport.country} <span class="text-slate-400 font-medium text-xs ml-1">/ ${airport.countryEn}</span></p>
                                </div>
                            </div>
                        </div>

                        <!-- 设施信息 -->
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full"></span>
                                Facility Specs
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">Terminals</span>
                                    <p class="text-slate-700 font-bold text-sm">${airport.terminals}</p>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">Runways</span>
                                    <p class="text-slate-700 font-bold text-sm">${airport.runways}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 联系方式 -->
                    <div class="pt-6 border-t border-slate-100">
                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="flex-1 space-y-4">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Contact Info</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center gap-3 text-slate-600 text-sm font-medium">
                                        <div class="bg-slate-100 p-2 rounded-lg text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                            </svg>
                                        </div>
                                        ${airport.address}
                                    </div>
                                    <div class="flex items-center gap-3 text-slate-600 text-sm font-medium">
                                        <div class="bg-slate-100 p-2 rounded-lg text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                            </svg>
                                        </div>
                                        ${airport.phone}
                                    </div>
                                </div>
                            </div>
                            <div class="w-full md:w-1/3 p-4 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col items-center justify-center text-center">
                                <span class="text-[10px] text-slate-400 font-bold uppercase mb-2">Official Website</span>
                                <a href="https://${airport.website}" target="_blank" class="text-blue-600 font-bold text-sm hover:text-blue-700 transition-colors break-all">
                                    ${airport.website}
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- 基地航空公司 -->
                    <div class="pt-6 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Hub Carriers</h3>
                        <div class="flex flex-wrap gap-2">
                            ${airport.hubFor.map(airline => `
                                <span class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-200 hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600 transition-all cursor-default">${airline}</span>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 机场简介 -->
                    <div class="pt-6 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Overview</h3>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 italic text-slate-600 leading-relaxed text-sm">
                            "${airport.description}"
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // 事件监听
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const results = searchAirports(e.target.value);
            renderTable(results);
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 初始化：默认显示所有机场
        renderTable(airports);
    </script>
</body>
</html>
