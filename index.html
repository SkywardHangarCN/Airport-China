<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">中国机场查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
        }

        .header-bg {
            background-color: #2b5ae9;
        }

        .search-bar-bg {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .card-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 黑白祭奠模式 */
        html.grayscale-mode {
            filter: grayscale(100%);
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        .region-tag {
            background-color: #eef2ff;
            color: #4f46e5;
        }

        .region-tag-green {
            background-color: #f0fdf4;
            color: #16a34a;
        }

        .region-tag-blue {
            background-color: #eff6ff;
            color: #2563eb;
        }

        #donateModal .transform {
            transition: transform 0.3s ease-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-900">
    <!-- 头部 -->
    <header class="header-bg text-white py-6 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex items-center justify-between gap-4">
            <!-- Logo & Title -->
            <div class="flex items-center gap-3 shrink-0">
                <div class="bg-white/20 p-2 rounded-full">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </div>
                <div>
                    <h1 id="headerTitle" class="text-xl font-bold leading-tight">中国机场查询系统</h1>
                    <p id="headerSubtitle" class="text-[10px] text-white/70 font-medium tracking-wide uppercase">China Airport Query System</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl hidden md:block">
                <div class="relative group">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜索国家、城市、ICAO代码或机场名称..." 
                        class="w-full search-bar-bg border-0 rounded-full py-3 px-12 text-white placeholder-white/50 focus:ring-2 focus:ring-white/30 transition-all outline-none"
                    >
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Stats & Language -->
            <div class="flex items-center gap-4 shrink-0">
                <div class="hidden lg:flex items-center bg-white/10 rounded-full px-4 py-2 text-sm font-bold border border-white/10">
                    <span id="totalCount" class="mr-1">0</span> 机场
                </div>
                
                <div class="relative">
                    <select id="langSelector" class="bg-white/10 border border-white/20 text-white text-xs font-bold py-2 px-4 rounded-xl cursor-pointer hover:bg-white/20 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none pr-8">
                        <option value="zh-Hans" class="bg-slate-900">CN 简体中文</option>
                        <option value="zh-Hant" class="bg-slate-900">TW 繁体中文</option>
                        <option value="en" class="bg-slate-900">EN English</option>
                        <option value="ja" class="bg-slate-900">JA 日本語</option>
                        <option value="ko" class="bg-slate-900">KO 한국어</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white/70">
                        <svg class="h-4 w-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-[84px] z-40">
        <div class="container mx-auto px-4 py-3 flex flex-wrap items-end justify-between gap-4">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 md:pb-0" id="regionFilters">
                <button class="region-btn active px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-[#2b5ae9] text-white" data-region="全部">全部</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="亚洲"><span class="w-2 h-2 rounded-full bg-blue-400"></span>亚洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="欧洲"><span class="w-2 h-2 rounded-full bg-indigo-400"></span>欧洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="非洲"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>非洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="北美洲"><span class="w-2 h-2 rounded-full bg-cyan-400"></span>北美洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="南美洲"><span class="w-2 h-2 rounded-full bg-sky-400"></span>南美洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="大洋洲"><span class="w-2 h-2 rounded-full bg-blue-500"></span>大洋洲</button>
                <button class="region-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all hover:bg-slate-100 text-slate-600 flex items-center gap-2" data-region="中东"><span class="w-2 h-2 rounded-full bg-orange-400"></span>中东</button>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative">
                    <select id="sortSelector" class="bg-slate-50 border border-slate-200 text-slate-600 text-xs font-bold py-2 px-4 rounded-xl cursor-pointer hover:bg-slate-100 transition-all focus:outline-none appearance-none pr-8">
                        <option value="name">按名称排序</option>
                        <option value="icao">按ICAO排序</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                        <svg class="h-3 w-3 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
                <div class="text-sm text-slate-400 font-medium">
                    找到 <span id="resultCount" class="text-[#2b5ae9] font-bold">0</span> 个机场
                </div>
                <button onclick="openDonateModal()" class="bg-red-50 text-red-500 px-4 py-1.5 rounded-full text-sm font-bold hover:bg-red-100 transition-all flex items-center gap-1">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    赞赏
                </button>
            </div>
        </div>
    </div>

    <!-- 列表内容 -->
    <main class="container mx-auto px-4 py-8">
        <div id="airportGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- 动态渲染 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-blue-950 text-blue-200/60 py-16 mt-20 border-t border-blue-900">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-10 max-w-6xl mx-auto">
                <div class="text-center md:text-left space-y-4 max-w-md">
                    <div class="flex items-center gap-3 justify-center md:justify-start">
                        <div class="bg-blue-600 p-2 rounded-lg">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.25c-.16.09-.33.12-.5.12s-.34-.03-.5-.12l-7.97-4.25c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.97-4.25c.16-.09.33-.12.5-.12s.34.03.5.12l7.97 4.25c.32.17.53.5.53.88v9z"/>
                            </svg>
                        </div>
                        <span id="footerBrand" class="text-xl font-bold text-white tracking-tight">云端机库CN</span>
                    </div>
                    <p id="footerDesc" class="text-xs leading-relaxed opacity-60 font-medium">
                        本页面数据仅供模拟飞行、航空爱好者使用，非官方资料。严禁用于任何违法违规及危害国家安全的行为。数据内容不具备导航效力。
                    </p>
                </div>
                
                <div class="flex flex-col items-center md:items-end gap-4">
                    <div class="flex gap-6 text-sm font-bold uppercase tracking-widest">
                        <a href="#" id="footerLinkDb" class="hover:text-white transition-colors">数据库</a>
                        <a href="#" id="footerLinkApi" class="hover:text-white transition-colors">接口</a>
                        <a href="#" id="footerLinkSupport" class="hover:text-white transition-colors">支持</a>
                    </div>
                    <div class="pt-4 text-center md:text-right">
                        <p id="footerCopyright" class="text-[10px] text-blue-300 font-bold uppercase tracking-tighter">
                            Copyright © 2026 云端机库CN. 保留所有权利。
                        </p>
                        <p id="footerAllRights" class="text-[10px] text-blue-400/50 mt-1">
                            版权所有© 2026 云端机库CN.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div id="modalContent">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 纪念日公告弹窗 -->
    <div id="memorialModal" class="fixed inset-0 memorial-modal-overlay hidden items-center justify-center z-[1000] p-4 sm:p-6">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-lg w-full overflow-hidden transform transition-all my-auto">
            <!-- 标题区域 -->
            <div id="memorialTitleArea" class="memorial-title-area">
                <div id="memorialTitleBg" class="memorial-title-bg"></div>
                <h2 id="memorialTitle" class="memorial-title-text"></h2>
                <p id="memorialSubtitle" class="memorial-subtitle-text"></p>
            </div>
            
            <!-- 内容区域 -->
            <div class="p-8 bg-slate-50">
                <div id="memorialContent" class="memorial-content-area whitespace-pre-line font-medium shadow-inner"></div>
                <button onclick="closeMemorial()" class="mt-8 w-full py-5 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-xl active:scale-95 text-lg">
                    确认
                </button>
            </div>
        </div>
    </div>

    <!-- 普通通告弹窗 -->
    <div id="noticeModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-[900] p-4 sm:p-6">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-md w-full overflow-hidden transform transition-all my-auto relative">
            <!-- 头部：深色背景 -->
            <div class="header-bg p-10 text-white text-center relative overflow-hidden">
                <!-- 关闭按钮 (右上角叉号) -->
                <button onclick="closeNotice()" class="absolute top-6 right-6 text-white/50 hover:text-white transition-colors z-20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>

                <div class="mb-4 inline-block p-4 rounded-full bg-white/5 border border-white/10 relative z-10">
                    <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold tracking-tight relative z-10">系统通告</h2>
            </div>

            <!-- 主体内容 -->
            <div class="p-10 space-y-6 bg-white">
                <div>
                    <h3 id="noticeTitle" class="text-xl font-bold text-slate-900 mb-2"></h3>
                    <p id="noticeDate" class="text-slate-400 text-sm font-medium tracking-wide"></p>
                </div>
                
                <div id="noticeContent" class="text-slate-600 leading-relaxed text-sm whitespace-pre-line font-medium max-h-[250px] overflow-y-auto pr-2 custom-scrollbar"></div>
                
                <button onclick="closeNotice()" class="w-full py-4 bg-neutral-600 text-white rounded-2xl font-bold hover:bg-neutral-700 transition-all shadow-lg active:scale-95 text-lg">
                    我知道了
                </button>
            </div>
        </div>
    </div>

    <!-- 赞赏弹窗 -->
    <div id="donateModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-[1100] p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full text-center p-8 transform transition-all">
            <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">感谢您的支持</h2>
            <p class="text-slate-500 mb-6 text-sm">如果您觉得本平台对您有帮助，欢迎扫码赞赏。您的每一份支持，都是我们持续优化的动力。</p>
            
            <div class="bg-slate-50 p-6 rounded-2xl mb-6">
                <p class="text-xs font-bold text-slate-400 uppercase mb-3">WeChat QR Code</p>
                <img src="https://skywardhangarcn.github.io/China-Airlines/mm_reward_qrcode_1774157633233.png" alt="WeChat QR Code" class="w-48 h-48 mx-auto rounded-lg shadow-md">
                <p class="text-xs text-slate-400 mt-3 font-medium">微信扫一扫 · WeChat Scan</p>
            </div>

            <button onclick="closeDonateModal()" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold hover:bg-slate-900 transition-all shadow-lg active:scale-95 text-base">
                关闭
            </button>
        </div>
    </div>

    <script src="airports-data.js"></script>
    <script src="black-data.js"></script>
    <script src="notice.js"></script>
    <script>
        const translations = {
            'zh-Hans': {
                pageTitle: "全球机场查询系统",
                headerTitle: "Global Airport Explorer",
                headerSubtitle: "全球机场查询系统",
                searchInput: "搜索国家、城市、ICAO代码或机场名称...",
                totalCount: "机场",
                foundCount: "找到 {count} 个机场",
                sortLabel: "按名称排序",
                donateBtn: "赞赏",
                modalDetails: "详情",
                modalIcao: "ICAO 代码",
                modalIata: "IATA 代码",
                modalGeo: "地理位置",
                modalCity: "城市",
                modalCountry: "国家",
                modalSpecs: "设施规格",
                modalTerminals: "航站楼",
                modalRunways: "跑道数量",
                modalContact: "联系信息",
                modalWebsite: "官方网站",
                modalHubs: "基地航空公司",
                modalOverview: "概况",
                noResults: "未找到匹配项",
                countryLabel: "国家",
                coordLabel: "坐标",
                cityLabel: "城市"
            },
            'zh-Hant': {
                pageTitle: "全球机场系統",
                headerTitle: "Global Airport Explorer",
                headerSubtitle: "全球机场查詢系統",
                searchInput: "搜尋國家、城市、ICAO代碼或机场名稱...",
                totalCount: "机场",
                foundCount: "找到 {count} 個机场",
                sortLabel: "按名稱排序",
                donateBtn: "贊助",
                modalDetails: "詳情",
                modalIcao: "ICAO 代碼",
                modalIata: "IATA 代碼",
                modalGeo: "地理位置",
                modalCity: "城市",
                modalCountry: "國家",
                modalSpecs: "設施規格",
                modalTerminals: "航站樓",
                modalRunways: "跑道數量",
                modalContact: "聯繫信息",
                modalWebsite: "官方網站",
                modalHubs: "基地航空公司",
                modalOverview: "概況",
                noResults: "未找到匹配項",
                countryLabel: "國家",
                coordLabel: "坐標",
                cityLabel: "城市"
            },
            'en': {
                pageTitle: "Global Airport Explorer",
                headerTitle: "Global Airport Explorer",
                headerSubtitle: "Global Aviation Database",
                searchInput: "Search country, city, ICAO or name...",
                totalCount: "Airports",
                foundCount: "{count} Airports found",
                sortLabel: "Sort by Name",
                donateBtn: "Donate",
                modalDetails: "Details",
                modalIcao: "ICAO Code",
                modalIata: "IATA Code",
                modalGeo: "Location",
                modalCity: "City",
                modalCountry: "Country",
                modalSpecs: "Specifications",
                modalTerminals: "Terminals",
                modalRunways: "Runways",
                modalContact: "Contact",
                modalWebsite: "Website",
                modalHubs: "Hub Carriers",
                modalOverview: "Overview",
                noResults: "No matches found",
                countryLabel: "Country",
                coordLabel: "Coords",
                cityLabel: "City"
            }
        };
        let currentLang = 'zh-Hans';
        let currentRegion = '全部';
        let currentSort = 'name';

        function parseCode(code) {
            if (!code || code === 'N/A') return { clean: 'N/A', suffix: '' };
            const parts = code.split('-');
            return {
                clean: parts[0],
                suffix: parts.length > 1 ? parts[1] : ''
            };
        }

        function getRegionColorClass(region) {
            const colors = {
                '亚洲': 'bg-blue-50 text-blue-600',
                '欧洲': 'bg-indigo-50 text-indigo-600',
                '非洲': 'bg-emerald-50 text-emerald-600',
                '北美洲': 'bg-cyan-50 text-cyan-600',
                '南美洲': 'bg-sky-50 text-sky-600',
                '大洋洲': 'bg-blue-50 text-blue-700',
                '中东': 'bg-orange-50 text-orange-600'
            };
            return colors[region] || 'bg-slate-50 text-slate-600';
        }

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations['en'];
            
            document.documentElement.lang = lang;
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('headerTitle').textContent = t.headerTitle;
            document.getElementById('headerSubtitle').textContent = t.headerSubtitle;
            document.getElementById('searchInput').placeholder = t.searchInput;
            
            updateDisplay();
        }

        function renderCards(data) {
            const grid = document.getElementById('airportGrid');
            const resultCountEl = document.getElementById('resultCount');
            const totalCountEl = document.getElementById('totalCount');
            const t = translations[currentLang] || translations['en'];
            
            totalCountEl.textContent = airports.length;
            resultCountEl.textContent = data.length;

            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <svg class="w-20 h-20 mx-auto mb-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <p class="text-xl font-bold text-slate-400">${t.noResults}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = data.map(item => {
                const icaoInfo = parseCode(item.icao);
                // 模拟一个区域，如果数据里没有的话
                const region = item.region || (item.country === '中国' ? '亚洲' : '其他');
                const colorClass = getRegionColorClass(region);
                
                return `
                    <div class="bg-white rounded-[2rem] p-6 card-shadow card-hover transition-all cursor-pointer group relative" onclick="showDetail('${item.icao}')">
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-blue-600 font-bold tracking-wider text-sm">${icaoInfo.clean}</span>
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold ${colorClass}">${region}</span>
                        </div>
                        
                        <div class="mb-6">
                            <h3 class="text-xl font-extrabold text-slate-900 mb-1 group-hover:text-[#2b5ae9] transition-colors line-clamp-1">${item.nameZh}</h3>
                            <p class="text-slate-400 text-xs font-medium uppercase tracking-wide line-clamp-1">${item.nameEn}</p>
                        </div>
                        
                        <div class="space-y-3 mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-500 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2.5 2.5 0 012.5-2.5h1.065M9 21h6a2 2 0 002-2v-1a2 2 0 00-2-2H9a2 2 0 00-2 2v1a2 2 0 002 2z"></path></svg>
                                </div>
                                <div>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase leading-none mb-1">${t.countryLabel}</p>
                                    <p class="text-sm font-bold text-slate-700">${item.country}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-500 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                </div>
                                <div>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase leading-none mb-1">${t.cityLabel}</p>
                                    <p class="text-sm font-bold text-slate-700 line-clamp-1">${item.city}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="absolute bottom-6 right-6 w-10 h-10 rounded-full border border-slate-100 flex items-center justify-center text-slate-300 group-hover:bg-[#2b5ae9] group-hover:text-white group-hover:border-[#2b5ae9] transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateDisplay() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = airports.filter(item => {
                const matchesKeyword = !keyword || 
                    item.nameZh.toLowerCase().includes(keyword) ||
                    item.nameEn.toLowerCase().includes(keyword) ||
                    item.icao.toLowerCase().includes(keyword) ||
                    item.city.toLowerCase().includes(keyword) ||
                    item.country.toLowerCase().includes(keyword);
                
                const region = item.region || (item.country === '中国' ? '亚洲' : '其他');
                const matchesRegion = currentRegion === '全部' || region === currentRegion;
                
                return matchesKeyword && matchesRegion;
            });

            // Sorting
            filtered.sort((a, b) => {
                if (currentSort === 'name') {
                    return a.nameZh.localeCompare(b.nameZh, 'zh-Hans-CN');
                } else if (currentSort === 'icao') {
                    return a.icao.localeCompare(b.icao);
                }
                return 0;
            });

            renderCards(filtered);
        }

        function showDetail(icao) {
            const airport = airports.find(a => a.icao === icao);
            if (!airport) return;

            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const t = translations[currentLang] || translations['en'];

            const icaoInfo = parseCode(airport.icao);
            const iataInfo = parseCode(airport.iata);
            
            content.innerHTML = `
                <div class="header-bg text-white p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-6">
                            <div class="bg-white/20 px-3 py-1 rounded-md border border-white/10 text-[10px] font-bold uppercase tracking-widest text-white mb-2 inline-block">
                                ${t.modalDetails}
                            </div>
                            <button onclick="closeModal()" class="text-white/50 hover:text-white transition-colors bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <h2 class="text-3xl font-extrabold tracking-tight mb-2">${airport.nameZh}</h2>
                        <p class="text-white/60 font-medium text-sm mb-6 uppercase tracking-wider">${airport.nameEn}</p>
                        
                        <div class="flex gap-4">
                            <div class="bg-white/10 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-white/50 uppercase font-bold block mb-1">${t.modalIcao}</span>
                                <span class="font-mono text-lg font-bold text-white">${icaoInfo.clean}</span>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-white/50 uppercase font-bold block mb-1">${t.modalIata}</span>
                                <span class="font-mono text-lg font-bold text-white">${iataInfo.clean}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="p-8 space-y-8 bg-white">
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-blue-500 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                                ${t.modalGeo}
                            </h3>
                            <div class="grid grid-cols-1 gap-3">
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">${t.modalCity}</span>
                                    <p class="text-slate-900 font-bold">${airport.city} <span class="text-slate-400 font-medium text-xs ml-1">/ ${airport.cityEn}</span></p>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">${t.modalCountry}</span>
                                    <p class="text-slate-900 font-bold">${airport.country} <span class="text-slate-400 font-medium text-xs ml-1">/ ${airport.countryEn}</span></p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-blue-500 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-400 rounded-full"></span>
                                ${t.modalSpecs}
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">${t.modalTerminals}</span>
                                    <p class="text-slate-900 font-bold text-sm">${airport.terminals}</p>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase">${t.modalRunways}</span>
                                    <p class="text-slate-900 font-bold text-sm">${airport.runways}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100">
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-blue-500 uppercase tracking-widest">${t.modalContact}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="flex items-center gap-3 text-slate-600 text-sm font-medium">
                                    <div class="bg-slate-50 p-2 rounded-lg text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                    </div>
                                    ${airport.address}
                                </div>
                                <div class="flex items-center gap-3 text-slate-600 text-sm font-medium">
                                    <div class="bg-slate-50 p-2 rounded-lg text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    </div>
                                    ${airport.phone}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-3">${t.modalOverview}</h3>
                        <div class="bg-slate-50 p-6 rounded-2xl italic text-slate-600 leading-relaxed text-sm">
                            "${airport.description}"
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', updateDisplay);
        
        document.getElementById('langSelector').addEventListener('change', (e) => {
            switchLanguage(e.target.value);
        });

        document.getElementById('sortSelector').addEventListener('change', (e) => {
            currentSort = e.target.value;
            updateDisplay();
        });

        document.getElementById('regionFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.region-btn');
            if (!btn) return;

            document.querySelectorAll('.region-btn').forEach(b => {
                b.classList.remove('active', 'bg-[#2b5ae9]', 'text-white');
                b.classList.add('hover:bg-slate-100', 'text-slate-600');
            });

            btn.classList.add('active', 'bg-[#2b5ae9]', 'text-white');
            btn.classList.remove('hover:bg-slate-100', 'text-slate-600');
            
            currentRegion = btn.dataset.region;
            updateDisplay();
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            updateDisplay();
            checkMemorialDays();
            if (document.getElementById('memorialModal').classList.contains('hidden')) {
                checkSiteNotices();
            }
        });

        // 纪念日检测
        function checkMemorialDays() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();

            const todayMemorial = memorialDays.find(m => m.month === month && m.day === day);
            
            if (todayMemorial) {
                if (todayMemorial.enableGrayscale) {
                    document.documentElement.classList.add('grayscale-mode');
                }
                
                const modal = document.getElementById('memorialModal');
                const title = document.getElementById('memorialTitle');
                const subtitle = document.getElementById('memorialSubtitle');
                const content = document.getElementById('memorialContent');
                const titleBg = document.getElementById('memorialTitleBg');
                
                title.textContent = todayMemorial.title;
                subtitle.textContent = todayMemorial.subtitle || '';
                content.textContent = typeof todayMemorial.getContent === 'function' 
                    ? todayMemorial.getContent(year) 
                    : (todayMemorial.content || '');
                
                if (todayMemorial.titleBgUrl) {
                    titleBg.style.backgroundImage = `url('${todayMemorial.titleBgUrl}')`;
                    titleBg.style.display = 'block';
                } else {
                    titleBg.style.display = 'none';
                }
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
                return true; // 表示有纪念日
            }
            return false;
        }

        function closeMemorial() {
            const modal = document.getElementById('memorialModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
            
            // 哀悼公告关闭后，检测并弹出普通通告
            checkSiteNotices();
        }

        // 普通通告检测
        function checkSiteNotices() {
            if (typeof siteNotices === 'undefined' || siteNotices.length === 0) return;
            
            // 这里默认弹出最新的通告
            const latestNotice = siteNotices[0];
            
            const modal = document.getElementById('noticeModal');
            const title = document.getElementById('noticeTitle');
            const content = document.getElementById('noticeContent');
            const date = document.getElementById('noticeDate');
            
            title.textContent = latestNotice.title;
            content.textContent = latestNotice.content;
            date.textContent = latestNotice.date || '';
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeNotice() {
            const modal = document.getElementById('noticeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function openDonateModal() {
            const modal = document.getElementById('donateModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeDonateModal() {
            const modal = document.getElementById('donateModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
