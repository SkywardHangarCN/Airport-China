<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">机场信息查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .commercial-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        }

        .modal-overlay {
            background-color: rgba(30, 58, 138, 0.4);
            backdrop-filter: blur(8px);
        }

        /* 表格样式优化 */
        .table-row {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
        }

        .table-row:hover {
            background-color: #f1f5f9;
            border-left: 3px solid #3b82f6;
            transform: translateX(2px);
        }

        .search-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card-premium {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 黑白祭奠模式 */
        html.grayscale-mode {
            filter: grayscale(100%);
            -webkit-filter: grayscale(100%);
            -moz-filter: grayscale(100%);
            -ms-filter: grayscale(100%);
            -o-filter: grayscale(100%);
        }

        .memorial-modal-overlay {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
        }

        /* 纪念弹窗样式强化 */
        .memorial-title-area {
            position: relative;
            background-color: #0f172a; /* 默认深蓝背景 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
            text-align: center;
        }

        .memorial-title-bg {
            position: absolute;
            inset: 0;
            opacity: 0.2;
            background-position: center;
            background-size: cover;
            z-index: 1;
        }

        .memorial-title-text {
            position: relative;
            z-index: 10;
            color: white;
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
        }

        .memorial-subtitle-text {
            position: relative;
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 0.75rem;
        }

        .memorial-content-area {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: left; /* 左对齐 */
            max-height: 300px; /* 最大高度 */
            overflow-y: auto; /* 开启滚动 */
            line-height: 1.8; /* 行高 1.8 */
            font-size: 16px; /* 字号 16px */
            color: black; /* 文字黑色 */
        }

        /* 自定义滚动条样式 */
        .memorial-content-area::-webkit-scrollbar {
            width: 6px;
        }
        .memorial-content-area::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .memorial-content-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .memorial-content-area::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 通告弹窗自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body class="bg-blue-50/30 min-h-screen text-slate-900">
    <!-- 头部 -->
    <header class="commercial-gradient text-white py-12 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        
        <!-- 语言选择器 -->
        <div class="absolute top-4 right-4 z-30">
            <div class="relative inline-block text-left">
                <select id="langSelector" class="bg-white/10 backdrop-blur-md border border-white/20 text-white text-xs font-bold py-2 px-4 rounded-xl cursor-pointer hover:bg-white/20 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none pr-8">

                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                    <svg class="h-4 w-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="container mx-auto px-4 relative z-10">
            <div class="flex flex-col items-center">
                <div class="mb-4 bg-blue-500/20 p-3 rounded-2xl backdrop-blur-md border border-white/10">
                    <svg class="w-10 h-10 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.25c-.16.09-.33.12-.5.12s-.34-.03-.5-.12l-7.97-4.25c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.97-4.25c.16-.09.33-.12.5-.12s.34.03.5.12l7.97 4.25c.32.17.53.5.53.88v9z"/>
                    </svg>
                </div>
                <h1 id="headerTitle" class="text-4xl md:text-5xl font-extrabold tracking-tight text-center mb-3 bg-clip-text text-transparent bg-gradient-to-b from-white to-blue-100">
                    中国机场信息查询系统
                </h1>
                <div class="h-1 w-24 bg-white/30 rounded-full mb-4"></div>
                <p class="text-center text-blue-100/70 font-medium tracking-widest uppercase text-sm">
                    China-Premium Aviation Database
                </p>
            </div>
        </div>
    </header>

    <!-- 搜索栏 -->
    <div class="container mx-auto px-4 -mt-8 relative z-20">
        <div class="max-w-3xl mx-auto">
            <div class="relative group">
                <div class="absolute inset-0 bg-blue-500/30 rounded-2xl blur-xl group-hover:bg-blue-600/40 transition-all duration-500"></div>
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜索机场名称、代码、城市或国家..." 
                        class="w-full px-7 py-5 pl-14 rounded-2xl border-0 focus:ring-2 focus:ring-blue-400 bg-white text-slate-800 shadow-2xl text-lg placeholder-slate-400"
                    >
                    <div class="absolute left-5 text-blue-500 group-focus-within:text-blue-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 机场列表 -->
    <div class="container mx-auto px-4 py-12 max-w-6xl">
        <div class="flex justify-between items-end mb-6 px-2">
            <div>
                <h2 id="dbTitle" class="text-2xl font-bold text-blue-900">机场数据库</h2>
                <p id="dbSubtitle" class="text-blue-600/70 text-sm mt-1">实时更新的全球民航与军事设施资讯</p>
            </div>
            <p id="resultCount" class="text-sm font-bold text-blue-700 bg-blue-50 px-4 py-2 rounded-lg border border-blue-200"></p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-blue-100 overflow-hidden card-premium">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-blue-50/50 backdrop-blur-sm border-b border-blue-100">
                            <th id="thNameZh" class="px-8 py-5 text-left text-xs font-bold text-blue-600 uppercase tracking-wider">中文名称</th>
                            <th id="thNameEn" class="px-8 py-5 text-left text-xs font-bold text-blue-600 uppercase tracking-wider">英文名称</th>
                            <th id="thIcao" class="px-8 py-5 text-center text-xs font-bold text-blue-600 uppercase tracking-wider">ICAO</th>
                            <th id="thIata" class="px-8 py-5 text-center text-xs font-bold text-blue-600 uppercase tracking-wider">IATA</th>
                            <th id="thCity" class="px-8 py-5 text-left text-xs font-bold text-blue-600 uppercase tracking-wider">城市</th>
                        </tr>
                    </thead>
                    <tbody id="airportTable" class="divide-y divide-blue-50">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-blue-950 text-blue-200/60 py-16 mt-20 border-t border-blue-900">
        <div class="container mx-auto px-4">

        </div>

        <div class="bg-white rounded-[2rem] shadow-2xl max-w-md w-full overflow-hidden transform transition-all my-auto relative">
            <!-- 头部：深色背景 -->
            <div class="bg-neutral-700 p-10 text-white text-center relative overflow-hidden">
                <!-- 关闭按钮 (右上角叉号) -->
                <button onclick="closeNotice()" class="absolute top-6 right-6 text-white/50 hover:text-white transition-colors z-20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>

                <div class="mb-4 inline-block p-4 rounded-full bg-white/5 border border-white/10 relative z-10">
                    <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold tracking-tight relative z-10">系统通告</h2>
            </div>

            <!-- 主体内容 -->
            <div class="p-10 space-y-6 bg-white">
                <div>
                    <h3 id="noticeTitle" class="text-xl font-bold text-slate-900 mb-2"></h3>
                    <p id="noticeDate" class="text-slate-400 text-sm font-medium tracking-wide"></p>
                </div>
                
                <div id="noticeContent" class="text-slate-600 leading-relaxed text-sm whitespace-pre-line font-medium max-h-[250px] overflow-y-auto pr-2 custom-scrollbar"></div>
                
                <button onclick="closeNotice()" class="w-full py-4 bg-neutral-600 text-white rounded-2xl font-bold hover:bg-neutral-700 transition-all shadow-lg active:scale-95 text-lg">
                    我知道了
                </button>
            </div>
        </div>
    </div>

                dbSubtitle: "전 세계 민간 및 군사 시설 실시간 정보",
                thNameZh: "중국어 이름",
                thNameEn: "영어 이름",
                thIcao: "ICAO",
                thIata: "IATA",
                thCity: "도시",
                modalDetails: "공항 상세 정보",
                modalIcao: "ICAO 코드",
                modalIata: "IATA 코드",
                modalGeo: "지리적 위치",
                modalCity: "도시",
                modalCountry: "국가",
                modalSpecs: "시설 사양",
                modalTerminals: "터미널",
                modalRunways: "활주로 수",
                modalContact: "연락처 정보",
                modalWebsite: "공식 웹사이트",
                modalHubs: "허브 항공사",
                modalOverview: "개요",
                footerDesc: "이 데이터는 비행 시뮬레이션 및 항공 애호가용입니다. 공식 항행용이 아닙니다. 불법 행위 사용을 엄격히 금지합니다.",
                footerLinkDb: "데이터베이스",
                footerLinkApi: "API",
                footerLinkSupport: "지원",
                footerCopyright: "Copyright © 2026 클라우드행어CN. All rights reserved.",
                footerAllRights: "저작권© 2026 클라우드행어CN.",
                noResults: "검색 결과가 없습니다",
                resultCount: "총 {count}개 공항"
            },
            'lzh': {
                pageTitle: "空港志",
                headerTitle: "中土空港志略",
                searchInput: "搜名、號、邑、邦...",
                dbTitle: "空港庫",
                dbSubtitle: "天下民航、軍事設施，隨時更始",
                thNameZh: "華夏名",
                thNameEn: "泰西名",
                thIcao: "ICAO",
                thIata: "IATA",
                thCity: "邑",
                modalDetails: "空港詳解",
                modalIcao: "ICAO 號",
                modalIata: "IATA 號",
                modalGeo: "方輿",
                modalCity: "邑",
                modalCountry: "邦",
                modalSpecs: "規模",
                modalTerminals: "航站",
                modalRunways: "馳道",
                modalContact: "通訊",
                modalWebsite: "官網",
                modalHubs: "駐劄航司",
                modalOverview: "概況",
                footerDesc: "此志僅供模擬飛行、航空雅好者之用，非官家正典。嚴禁逆法亂綱、危害社稷之舉。此中文字，不足為導航之憑。",
                footerLinkDb: "庫",
                footerLinkApi: "口",
                footerLinkSupport: "佐",
                footerCopyright: "Copyright © 2026 雲端機庫CN. 權利悉備。",
                footerAllRights: "版權所有© 2026 雲端機庫CN.",
                noResults: "未見合規者",
                resultCount: "凡 {count} 處"
            }
        };

        let currentLang = 'zh-Hans';

        function parseCode(code) {
            if (!code || code === 'N/A') return { clean: 'N/A', suffix: '' };
            const parts = code.split('-');
            return {
                clean: parts[0],
                suffix: parts.length > 1 ? parts[1] : ''
            };
        }

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            // 更新 html lang 属性
            document.documentElement.lang = lang;

            // 更新静态文本
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('headerTitle').textContent = t.headerTitle;
            document.getElementById('searchInput').placeholder = t.searchInput;
            document.getElementById('dbTitle').textContent = t.dbTitle;
            document.getElementById('dbSubtitle').textContent = t.dbSubtitle;
            document.getElementById('thNameZh').textContent = t.thNameZh;
            document.getElementById('thNameEn').textContent = t.thNameEn;
            document.getElementById('thIcao').textContent = t.thIcao;
            document.getElementById('thIata').textContent = t.thIata;
            document.getElementById('thCity').textContent = t.thCity;
            document.getElementById('footerDesc').textContent = t.footerDesc;
            document.getElementById('footerLinkDb').textContent = t.footerLinkDb;
            document.getElementById('footerLinkApi').textContent = t.footerLinkApi;
            document.getElementById('footerLinkSupport').textContent = t.footerLinkSupport;
            document.getElementById('footerCopyright').textContent = t.footerCopyright;
            document.getElementById('footerAllRights').textContent = t.footerAllRights;

            // 重新渲染表格
            const keyword = document.getElementById('searchInput').value;
            renderTable(searchAirports(keyword));
        }

        // 渲染机场表格
        function renderTable(data) {
            const tbody = document.getElementById('airportTable');
            const countEl = document.getElementById('resultCount');
            const t = translations[currentLang];
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                            <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-lg">${t.noResults}</p>
                        </td>
                    </tr>
                `;
                countEl.textContent = '';
                return;
            }

            tbody.innerHTML = data.map(airport => {
                const icaoInfo = parseCode(airport.icao);
                const iataInfo = parseCode(airport.iata);
                return `
                <tr class="table-row cursor-pointer transition-all border-b border-blue-50/50" onclick="showDetail('${airport.icao}')">
                    <td class="px-8 py-5" title="${airport.nameZh}">
                        <div class="font-bold text-blue-900 whitespace-nowrap">${airport.nameZh}</div>
                    </td>
                    <td class="px-8 py-5 text-blue-600/70 text-sm font-medium whitespace-nowrap" title="${airport.nameEn}">${airport.nameEn}</td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-block bg-blue-100/50 text-blue-700 px-3 py-1 rounded-md font-mono text-xs font-bold border border-blue-200/50">${icaoInfo.clean}</span>
                    </td>
                    <td class="px-8 py-5 text-center">
                        <span class="inline-block bg-blue-50 text-blue-600 px-3 py-1 rounded-md font-mono text-xs font-bold border border-blue-100">${iataInfo.clean}</span>
                    </td>
                    <td class="px-8 py-5 text-blue-700/80 font-medium whitespace-nowrap" title="${currentLang === 'en' ? airport.cityEn : airport.city}">
                        <div class="flex items-center gap-2">
                            <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            </svg>
                            ${currentLang === 'en' ? airport.cityEn : airport.city}
                        </div>
                    </td>
                </tr>
            `}).join('');

            countEl.textContent = t.resultCount.replace('{count}', data.length);
        }

        // 搜索功能
        function searchAirports(keyword) {
            if (!keyword.trim()) {
                return airports;
            }
            
            const kw = keyword.toLowerCase().trim();
            return airports.filter(airport => 
                airport.nameZh.toLowerCase().includes(kw) ||
                airport.nameEn.toLowerCase().includes(kw) ||
                airport.icao.toLowerCase().includes(kw) ||
                airport.iata.toLowerCase().includes(kw) ||
                airport.city.toLowerCase().includes(kw) ||
                airport.cityEn.toLowerCase().includes(kw) ||
                airport.country.toLowerCase().includes(kw) ||
                airport.countryEn.toLowerCase().includes(kw)
            );
        }

        // 显示详情
        function showDetail(icao) {
            const airport = airports.find(a => a.icao === icao);
            if (!airport) return;

            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const t = translations[currentLang];

            const icaoInfo = parseCode(airport.icao);
            const iataInfo = parseCode(airport.iata);
            
            // 提取后缀并准备显示在概况中
            const combinedSuffix = [icaoInfo.suffix, iataInfo.suffix].filter(Boolean).join(' / ');
            const displayDescription = combinedSuffix 
                ? `${airport.description} [${combinedSuffix}]` 
                : airport.description;

            content.innerHTML = `
                <div class="commercial-gradient text-white p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-6">
                            <div class="bg-blue-500/20 px-3 py-1 rounded-md border border-white/10 text-[10px] font-bold uppercase tracking-widest text-blue-300 mb-2 inline-block">
                                ${t.modalDetails}
                            </div>
                            <button onclick="closeModal()" class="text-white/50 hover:text-white transition-colors bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <h2 class="text-3xl font-extrabold tracking-tight mb-2">${currentLang === 'en' ? airport.nameEn : airport.nameZh}</h2>
                        <p class="text-slate-400 font-medium text-sm mb-6 uppercase tracking-wider">${currentLang === 'en' ? airport.nameZh : airport.nameEn}</p>
                        
                        <div class="flex gap-4">
                            <div class="bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">${t.modalIcao}</span>
                                <span class="font-mono text-lg font-bold text-blue-400">${icaoInfo.clean}</span>
                            </div>
                            <div class="bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl">
                                <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">${t.modalIata}</span>
                                <span class="font-mono text-lg font-bold text-blue-400">${iataInfo.clean}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="p-8 space-y-8 bg-white">
                    <div class="grid grid-cols-2 gap-8">
                        <!-- 基本信息 -->
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                                ${t.modalGeo}
                            </h3>
                            <div class="grid grid-cols-1 gap-3">
                                <div class="group">
                                    <span class="text-[10px] text-blue-300 font-bold uppercase">${t.modalCity}</span>
                                    <p class="text-blue-900 font-bold group-hover:text-blue-600 transition-colors">${airport.city} <span class="text-blue-300 font-medium text-xs ml-1">/ ${airport.cityEn}</span></p>
                                </div>
                                <div class="group">
                                    <span class="text-[10px] text-blue-300 font-bold uppercase">${t.modalCountry}</span>
                                    <p class="text-blue-900 font-bold group-hover:text-blue-600 transition-colors">${airport.country} <span class="text-blue-300 font-medium text-xs ml-1">/ ${airport.countryEn}</span></p>
                                </div>
                            </div>
                        </div>

                        <!-- 设施信息 -->
                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-400 rounded-full"></span>
                                ${t.modalSpecs}
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <span class="text-[10px] text-blue-300 font-bold uppercase">${t.modalTerminals}</span>
                                    <p class="text-blue-900 font-bold text-sm">${airport.terminals}</p>
                                </div>
                                <div>
                                    <span class="text-[10px] text-blue-300 font-bold uppercase">${t.modalRunways}</span>
                                    <p class="text-blue-900 font-bold text-sm">${airport.runways}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 联系方式 -->
                    <div class="pt-6 border-t border-blue-50">
                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="flex-1 space-y-4">
                                <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest">${t.modalContact}</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center gap-3 text-blue-800 text-sm font-medium">
                                        <div class="bg-blue-50 p-2 rounded-lg text-blue-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                            </svg>
                                        </div>
                                        ${airport.address}
                                    </div>
                                    <div class="flex items-center gap-3 text-blue-800 text-sm font-medium">
                                        <div class="bg-blue-50 p-2 rounded-lg text-blue-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                            </svg>
                                        </div>
                                        ${airport.phone}
                                    </div>
                                </div>
                            </div>
                            <div class="w-full md:w-1/3 p-4 bg-blue-50/50 rounded-2xl border border-blue-100 flex flex-col items-center justify-center text-center">
                                <span class="text-[10px] text-blue-400 font-bold uppercase mb-2">${t.modalWebsite}</span>
                                <a href="https://${airport.website}" target="_blank" class="text-blue-600 font-bold text-sm hover:text-blue-700 transition-colors break-all">
                                    ${airport.website}
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- 基地航空公司 -->
                    <div class="pt-6 border-t border-blue-50">
                        <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-4">${t.modalHubs}</h3>
                        <div class="flex flex-wrap gap-2">
                            ${airport.hubFor.map(airline => `
                                <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-xl text-xs font-bold border border-blue-100 hover:border-blue-300 hover:bg-blue-100 transition-all cursor-default">${airline}</span>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 机场简介 -->
                    <div class="pt-6 border-t border-blue-50">
                        <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3">${t.modalOverview}</h3>
                        <div class="bg-blue-50/50 p-6 rounded-2xl border border-blue-100 italic text-blue-800/80 leading-relaxed text-sm">
                            "${displayDescription}"
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // 事件监听
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const results = searchAirports(e.target.value);
            renderTable(results);
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        document.getElementById('langSelector').addEventListener('change', (e) => {
            switchLanguage(e.target.value);
        });

        // 初始化：默认显示所有机场
        renderTable(airports);

        // 页面加载后执行检测
        window.addEventListener('DOMContentLoaded', () => {
            checkMemorialDays();
            // 如果没有哀悼通告弹出，则尝试弹出普通通告
            if (document.getElementById('memorialModal').classList.contains('hidden')) {
                checkSiteNotices();
            }
        });

        // 纪念日检测
        function checkMemorialDays() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();

            const todayMemorial = memorialDays.find(m => m.month === month && m.day === day);
            
            if (todayMemorial) {
                if (todayMemorial.enableGrayscale) {
                    document.documentElement.classList.add('grayscale-mode');
                }
                
                const modal = document.getElementById('memorialModal');
                const title = document.getElementById('memorialTitle');
                const subtitle = document.getElementById('memorialSubtitle');
                const content = document.getElementById('memorialContent');
                const titleBg = document.getElementById('memorialTitleBg');
                
                title.textContent = todayMemorial.title;
                subtitle.textContent = todayMemorial.subtitle || '';
                content.textContent = typeof todayMemorial.getContent === 'function' 
                    ? todayMemorial.getContent(year) 
                    : (todayMemorial.content || '');
                
                if (todayMemorial.titleBgUrl) {
                    titleBg.style.backgroundImage = `url('${todayMemorial.titleBgUrl}')`;
                    titleBg.style.display = 'block';
                } else {
                    titleBg.style.display = 'none';
                }
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
                return true; // 表示有纪念日
            }
            return false;
        }

        function closeMemorial() {
            const modal = document.getElementById('memorialModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
            
            // 哀悼公告关闭后，检测并弹出普通通告
            checkSiteNotices();
        }

        // 普通通告检测
        function checkSiteNotices() {
            if (typeof siteNotices === 'undefined' || siteNotices.length === 0) return;
            
            // 这里默认弹出最新的通告
            const latestNotice = siteNotices[0];
            
            const modal = document.getElementById('noticeModal');
            const title = document.getElementById('noticeTitle');
            const content = document.getElementById('noticeContent');
            const date = document.getElementById('noticeDate');
            
            title.textContent = latestNotice.title;
            content.textContent = latestNotice.content;
            date.textContent = latestNotice.date || '';
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeNotice() {
            const modal = document.getElementById('noticeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
